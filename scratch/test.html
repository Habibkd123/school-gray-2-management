<!DOCTYPE html>
<html>
<head>

<style>

  .sheet { background: #ffffff; width: 800px; padding: 40px; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }

</head>
<body>
  <div class="sheet">
    <h1>Test Sheet</h1>
  </div>

</html>
